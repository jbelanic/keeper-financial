[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keeper-financial-api"
version = "0.1.0"
description = "Keeper Financial Phase 0 modular-monolith API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.18.5",
  "boto3==1.43.45",
  "cryptography==49.0.0",
  "defusedxml==0.7.1",
  "email-validator==2.2.0",
  "fastapi==0.139.0",
  "olefile==0.47",
  "Pillow==12.3.0",
  "PyJWT[crypto]==2.13.0",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "pypdf==6.14.2",
  "python-magic==0.4.27",
  "python-multipart==0.0.31",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.0",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.4"
]

[tool.hatch.build.targets.wheel]
packages = ["src/keeper_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008", "E501", "S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "boto3",
  "boto3.*",
  "botocore",
  "botocore.*",
  "defusedxml",
  "defusedxml.*",
  "magic",
  "olefile"
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
