name: keeper-financial

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keeper}
      POSTGRES_USER: ${POSTGRES_USER:-keeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - keeper_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - keeper_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-keeper-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set keeper http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "keeper/$${MINIO_BUCKET}" &&
        mc anonymous set none "keeper/$${MINIO_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"
    expose:
      - "3310"
    volumes:
      - keeper_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
    restart: unless-stopped

  documenso-tls:
    image: nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./infrastructure/documenso/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage/local-documenso-tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./storage/local-documenso-tls/server.key:/etc/nginx/tls/server.key:ro
    networks:
      default:
        aliases:
          - sign.keeperfinancial.ca
      documenso:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider --no-check-certificate https://127.0.0.1/",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: ${KEEPER_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-keeper}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-keeper}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${MINIO_BUCKET:-keeper-private}
      S3_REGION: us-east-1
      MALWARE_SCANNER_BACKEND: clamav
      MALWARE_SCANNER_FAIL_CLOSED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_CONNECT_TIMEOUT_SECONDS: 2
      CLAMAV_READ_TIMEOUT_SECONDS: 15
      CLAMAV_MAX_CHUNKS: 256
      CLAMAV_MAX_RESPONSE_BYTES: 4096
      DOCUMENSO_API_BASE_URL: https://sign.keeperfinancial.ca/api/v2
      DOCUMENSO_PUBLIC_BASE_URL: https://sign.keeperfinancial.ca
      SSL_CERT_FILE: /etc/ssl/certs/keeper-local-documenso-ca-bundle.crt
      # Local CORS allow-list. Browser traffic may originate from the public
      # localhost site or the dedicated apply.localhost borrower host. All
      # origins stay local-host HTTP so the production validator still passes.
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://apply.localhost:3000,http://127.0.0.1:8000
      SUPABASE_JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
      SUPABASE_USER_URL: http://host.docker.internal:54321/auth/v1/user
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set the local Supabase anon key in .env}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-54324}
      SMTP_FROM: ${SMTP_FROM:-keeper@keeperfinancial.ca}
      LEAD_NOTIFICATION_EMAIL_ENABLED: ${LEAD_NOTIFICATION_EMAIL_ENABLED:-false}
      LEAD_NOTIFICATION_ADMIN_EMAIL: ${LEAD_NOTIFICATION_ADMIN_EMAIL:-}
      LEAD_NOTIFICATION_BROKER_EMAIL: ${LEAD_NOTIFICATION_BROKER_EMAIL:-}
      LEAD_NOTIFICATION_SUBJECT: ${LEAD_NOTIFICATION_SUBJECT:-New Keeper contact request received}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage/local-documenso-tls/ca-bundle.crt:/etc/ssl/certs/keeper-local-documenso-ca-bundle.crt:ro
      - ./secrets/borrower_capability_hmac_key:/run/secrets/borrower_capability_hmac_key:ro
      - ./secrets/borrower_encryption_keyring:/run/secrets/borrower_encryption_keyring:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      documenso-tls:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set the local Supabase anon key in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_BROKERAGE_DISPLAY_NAME: ${NEXT_PUBLIC_BROKERAGE_DISPLAY_NAME:-Keeper Financial}
        NEXT_PUBLIC_BROKERAGE_LEGAL_NAME: ${NEXT_PUBLIC_BROKERAGE_LEGAL_NAME:-Keeper Financial Inc.}
        NEXT_PUBLIC_BROKERAGE_REGULATORY_TEXT: ${NEXT_PUBLIC_BROKERAGE_REGULATORY_TEXT:-}
        NEXT_PUBLIC_PUBLIC_ADDRESS: ${NEXT_PUBLIC_PUBLIC_ADDRESS:-}
        NEXT_PUBLIC_PUBLIC_EMAIL: ${NEXT_PUBLIC_PUBLIC_EMAIL:-}
        NEXT_PUBLIC_PUBLIC_PHONE: ${NEXT_PUBLIC_PUBLIC_PHONE:-}
        NEXT_PUBLIC_PUBLIC_PHONE_E164: ${NEXT_PUBLIC_PUBLIC_PHONE_E164:-}
        NEXT_PUBLIC_MORTGAGE_APPLICATION_URL: ${NEXT_PUBLIC_MORTGAGE_APPLICATION_URL:-}
        NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-}
        NEXT_PUBLIC_PRINCIPAL_BROKER: ${NEXT_PUBLIC_PRINCIPAL_BROKER:-}
    environment:
      # Next.js standalone server.js binds to process.env.HOSTNAME. Docker sets
      # that to the container ID by default, which is unresolvable and crashes
      # the server. Pin it to 0.0.0.0 so the container listens on all interfaces.
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8000
      SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set the local Supabase anon key in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_BROKERAGE_DISPLAY_NAME: ${NEXT_PUBLIC_BROKERAGE_DISPLAY_NAME:-Keeper Financial}
      NEXT_PUBLIC_BROKERAGE_LEGAL_NAME: ${NEXT_PUBLIC_BROKERAGE_LEGAL_NAME:-Keeper Financial Inc.}
      NEXT_PUBLIC_BROKERAGE_REGULATORY_TEXT: ${NEXT_PUBLIC_BROKERAGE_REGULATORY_TEXT:-}
      NEXT_PUBLIC_PUBLIC_ADDRESS: ${NEXT_PUBLIC_PUBLIC_ADDRESS:-}
      NEXT_PUBLIC_PUBLIC_EMAIL: ${NEXT_PUBLIC_PUBLIC_EMAIL:-}
      NEXT_PUBLIC_PUBLIC_PHONE: ${NEXT_PUBLIC_PUBLIC_PHONE:-}
      NEXT_PUBLIC_PUBLIC_PHONE_E164: ${NEXT_PUBLIC_PUBLIC_PHONE_E164:-}
      NEXT_PUBLIC_MORTGAGE_APPLICATION_URL: ${NEXT_PUBLIC_MORTGAGE_APPLICATION_URL:-}
      NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-}
      NEXT_PUBLIC_PRINCIPAL_BROKER: ${NEXT_PUBLIC_PRINCIPAL_BROKER:-}
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  keeper_postgres:
  keeper_minio:
  keeper_clamav:

networks:
  documenso:
    external: true
    name: documenso_default
