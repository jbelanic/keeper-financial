name: keeper-financial

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keeper}
      POSTGRES_USER: ${POSTGRES_USER:-keeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - keeper_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    # Decision 47: pinned musl-based alpine/minio build, used on BOTH the target
    # host and local dev so the stacks stay aligned. The official quay.io/minio
    # image is glibc-2.34 based and requires x86-64-v2; the target inspiron host
    # (AMD Athlon II) cannot execute it (SIGILL / exit 132), while this static
    # musl build runs on both. It runs as root because the image's `minio` user
    # cannot write the root-owned /data volume, and it ships no `mc`, so the
    # healthcheck probes MinIO's own HTTP liveness endpoint instead.
    image: docker.io/alpine/minio:RELEASE.2025-10-15T17-29-55Z@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - keeper_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  minio-init:
    # One-shot idempotent private-bucket creation using the API image's own
    # boto3 stack. This replaces the glibc-based `mc` image, which cannot run on
    # the below-baseline target host (decision 47) and would break the
    # minio -> minio-init -> api startup ordering there. Bucket provisioning
    # must never live inside Alembic migrations.
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${MINIO_BUCKET:-keeper-private}
      S3_REGION: us-east-1
    command: ["python", "scripts/init_minio_bucket.py"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"
    expose:
      - "3310"
    volumes:
      - keeper_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: ${KEEPER_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-keeper}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-keeper}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${MINIO_BUCKET:-keeper-private}
      S3_REGION: us-east-1
      MALWARE_SCANNER_BACKEND: clamav
      MALWARE_SCANNER_FAIL_CLOSED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_CONNECT_TIMEOUT_SECONDS: 2
      CLAMAV_READ_TIMEOUT_SECONDS: 15
      CLAMAV_MAX_CHUNKS: 256
      CLAMAV_MAX_RESPONSE_BYTES: 4096
      # Local CORS allow-list. Browser traffic may originate from the public
      # localhost site or the dedicated apply.localhost borrower host. All
      # origins stay local-host HTTP so the production validator still passes.
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://apply.localhost:3000,http://127.0.0.1:8000
      # Identity endpoints come from .env (decision 46): either the local CLI
      # endpoints for dev/test or the exact hosted .supabase.co endpoints for
      # production. The API validator accepts only those two shapes and fails
      # closed otherwise, so there is no loopback default here.
      SUPABASE_ISSUER: ${SUPABASE_ISSUER:?set SUPABASE_ISSUER in .env}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?set SUPABASE_JWKS_URL in .env}
      SUPABASE_USER_URL: ${SUPABASE_USER_URL:?set SUPABASE_USER_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set the Supabase anon key in .env}}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-54324}
      SMTP_FROM: ${SMTP_FROM:-keeper@keeperfinancial.ca}
      LEAD_NOTIFICATION_EMAIL_ENABLED: ${LEAD_NOTIFICATION_EMAIL_ENABLED:-false}
      LEAD_NOTIFICATION_ADMIN_EMAIL: ${LEAD_NOTIFICATION_ADMIN_EMAIL:-}
      LEAD_NOTIFICATION_BROKER_EMAIL: ${LEAD_NOTIFICATION_BROKER_EMAIL:-}
      LEAD_NOTIFICATION_SUBJECT: ${LEAD_NOTIFICATION_SUBJECT:-New Keeper contact request received}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets/borrower_capability_hmac_key:/run/secrets/borrower_capability_hmac_key:ro
      - ./secrets/borrower_encryption_keyring:/run/secrets/borrower_encryption_keyring:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set the Supabase anon key in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_BROKERAGE_DISPLAY_NAME: ${NEXT_PUBLIC_BROKERAGE_DISPLAY_NAME:-Keeper Financial}
        NEXT_PUBLIC_BROKERAGE_LEGAL_NAME: ${NEXT_PUBLIC_BROKERAGE_LEGAL_NAME:-Keeper Financial Inc.}
        NEXT_PUBLIC_BROKERAGE_REGULATORY_TEXT: ${NEXT_PUBLIC_BROKERAGE_REGULATORY_TEXT:-}
        NEXT_PUBLIC_PUBLIC_ADDRESS: ${NEXT_PUBLIC_PUBLIC_ADDRESS:-}
        NEXT_PUBLIC_PUBLIC_EMAIL: ${NEXT_PUBLIC_PUBLIC_EMAIL:-}
        NEXT_PUBLIC_PUBLIC_PHONE: ${NEXT_PUBLIC_PUBLIC_PHONE:-}
        NEXT_PUBLIC_PUBLIC_PHONE_E164: ${NEXT_PUBLIC_PUBLIC_PHONE_E164:-}
        NEXT_PUBLIC_MORTGAGE_APPLICATION_URL: ${NEXT_PUBLIC_MORTGAGE_APPLICATION_URL:-}
        NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-}
        NEXT_PUBLIC_PRINCIPAL_BROKER: ${NEXT_PUBLIC_PRINCIPAL_BROKER:-}
    environment:
      # Next.js standalone server.js binds to process.env.HOSTNAME. Docker sets
      # that to the container ID by default, which is unresolvable and crashes
      # the server. Pin it to 0.0.0.0 so the container listens on all interfaces.
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8000
      # Server-side containers reach Supabase Auth through the internal route:
      # the host gateway for the local CLI stack, or NEXT_PUBLIC_SUPABASE_URL for
      # the hosted production project (decision 46).
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set the Supabase anon key in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_BROKERAGE_DISPLAY_NAME: ${NEXT_PUBLIC_BROKERAGE_DISPLAY_NAME:-Keeper Financial}
      NEXT_PUBLIC_BROKERAGE_LEGAL_NAME: ${NEXT_PUBLIC_BROKERAGE_LEGAL_NAME:-Keeper Financial Inc.}
      NEXT_PUBLIC_BROKERAGE_REGULATORY_TEXT: ${NEXT_PUBLIC_BROKERAGE_REGULATORY_TEXT:-}
      NEXT_PUBLIC_PUBLIC_ADDRESS: ${NEXT_PUBLIC_PUBLIC_ADDRESS:-}
      NEXT_PUBLIC_PUBLIC_EMAIL: ${NEXT_PUBLIC_PUBLIC_EMAIL:-}
      NEXT_PUBLIC_PUBLIC_PHONE: ${NEXT_PUBLIC_PUBLIC_PHONE:-}
      NEXT_PUBLIC_PUBLIC_PHONE_E164: ${NEXT_PUBLIC_PUBLIC_PHONE_E164:-}
      NEXT_PUBLIC_MORTGAGE_APPLICATION_URL: ${NEXT_PUBLIC_MORTGAGE_APPLICATION_URL:-}
      NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-}
      NEXT_PUBLIC_PRINCIPAL_BROKER: ${NEXT_PUBLIC_PRINCIPAL_BROKER:-}
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  keeper_postgres:
  keeper_minio:
  keeper_clamav:
