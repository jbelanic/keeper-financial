# Keeper Financial public ingress for the existing host-managed Nginx/Certbot stack.
#
# Preconditions:
# - Keeper web and API containers bind only to 127.0.0.1:3000 and 127.0.0.1:8000.
# - Existing host Nginx owns public 80/443 and its current Certbot renewal setup.
# - Replace the certificate paths only if this host's existing certificate layout differs.
# - Keep this as domain-specific configuration; do not alter unrelated WordPress/Immich limits.
# - Do not add proxy routes for Supabase Studio, Mailpit, MinIO, PostgreSQL, ClamAV,
#   or the MinIO Console.

server {
    listen 80;
    listen [::]:80;
    server_name keeperfinancial.ca www.keeperfinancial.ca apply.keeperfinancial.ca;

    # Preserve the host's established ACME challenge include/location if it has one.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keeperfinancial.ca;

    ssl_certificate /etc/letsencrypt/live/keeperfinancial.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keeperfinancial.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 26m;

    location /api/ {
        # No trailing slash here: preserve the /api/ prefix FastAPI routes expect.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.keeperfinancial.ca;

    ssl_certificate /etc/letsencrypt/live/keeperfinancial.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keeperfinancial.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://keeperfinancial.ca$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apply.keeperfinancial.ca;

    ssl_certificate /etc/letsencrypt/live/apply.keeperfinancial.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apply.keeperfinancial.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}
