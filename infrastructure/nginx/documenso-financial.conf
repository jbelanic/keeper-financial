# Keeper Financial — Documenso ingress for the existing host-managed Nginx/Certbot stack.
#
# Preconditions:
# - Documenso runs on this host with its app published to 127.0.0.1:3001 (its own
#   docker-compose.yaml; do NOT publish its Postgres/Redis to the host — they stay on
#   the documenso_default network, avoiding a 5432 collision with Keeper's db).
# - Existing host Nginx owns public 80/443; this file is an additional domain-specific
#   server block, not a replacement for the global Nginx config or Keeper's
#   keeper-financial.conf.
# - Replace certificate paths only if this host's certificate layout differs.
# - Do not proxy Documenso's Mailpit (1025/8025), Postgres, or Redis.

# WebSocket upgrade (Documenso uses realtime channels during signing).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sign.keeperfinancial.ca;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sign.keeperfinancial.ca;

    ssl_certificate /etc/letsencrypt/live/sign.keeperfinancial.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sign.keeperfinancial.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Documenso accepts larger documents; keep a bounded but generous limit.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}
